<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testimonials — Owl + Bootstrap 5</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <style>
        /* ========== NAMESPACE: tst- ========= */
        :root {
            --tst-accent: #0ea5e9;
            --tst-card: #e9f8fc;
            --tst-muted: #58636b;
            --tst-radius: 16px;
        }

        body.tst-body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: #fff;
            color: #15212a;
            padding: 36px 18px;
        }

    </style>
</head>

<body class="tst-body">


    <!-- Scripts: jQuery -> Owl -> Bootstrap (order matters) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function ($) {
            $(function () {
                const $owl = $('#tst-owl');

                $owl.owlCarousel({
                    loop: true,
                    margin: 20,
                    nav: true,
                    dots: false,
                    navText: ['‹', '›'],
                    responsive: {
                        0: { items: 1 },
                        576: { items: 1.2, stagePadding: 10 },
                        768: { items: 2 },
                        992: { items: 3 }
                    }
                });

                // Make inline left circle work as previous
                $('#tst-inline-prev').on('click', function () { $owl.trigger('prev.owl.carousel'); });

                // Ensure nav buttons are clickable even when stage padding present
                $('.tst-owl .owl-nav button').css('pointer-events', 'auto');

                // Optional: pause on hover
                $owl.on('mouseover', function () { $owl.trigger('stop.owl.autoplay'); });
            });
        })(jQuery);
    </script>
</body>

</html>
